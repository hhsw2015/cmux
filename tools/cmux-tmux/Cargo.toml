[package]
name = "cmux-tmux"
version = "0.0.3"
edition = "2021"
license = "MIT"

[lib]
name = "cmux_tmux"
path = "src/lib.rs"

[[bin]]
name = "cmux-tmux"
path = "src/bin/cmux-tmux.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
