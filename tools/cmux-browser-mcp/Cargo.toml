[package]
name = "cmux-browser-mcp"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "MCP stdio server that bridges agents to cmux's BrowserPanel via the cmux UDS socket."

[[bin]]
name = "cmux-browser-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
