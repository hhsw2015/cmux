name: Build unsigned app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          # Use the latest Xcode available (sort version numbers descending)
          XCODE_APP="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -t_ -k2 -rV | head -n 1)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -rV | head -n 1)"
          fi
          echo "Using: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Download pre-built GhosttyKit
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: spm-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Build arm64 app (unsigned)
        run: |
          xcodebuild -scheme cmux -configuration Release -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Ad-hoc sign
        run: |
          xattr -cr build/Build/Products/Release/cmux.app
          codesign --force --deep --sign - build/Build/Products/Release/cmux.app

      - name: Package .app as zip
        run: |
          cd build/Build/Products/Release
          zip -r -y cmux-unsigned.zip cmux.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmux-unsigned-app
          path: build/Build/Products/Release/cmux-unsigned.zip

      - name: Get version
        id: version
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Build/Products/Release/cmux.app/Contents/Info.plist)"
          SHA="$(git rev-parse --short HEAD)"
          echo "tag=v${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"
          echo "name=cmux ${VERSION} (${SHA}, unsigned arm64)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            Unsigned arm64 build from `${{ github.sha }}`.
            Remove quarantine after download: `xattr -cr /Applications/cmux.app`
          files: build/Build/Products/Release/cmux-unsigned.zip
          prerelease: true
